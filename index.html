<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Everender Ventures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050608;
      --fg: #ffffff;
      --muted: #a0a4b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #151924 0, var(--bg) 45%);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrap {
      text-align: center;
      padding: 40px 24px;
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
    }

    .wordmark {
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.9rem;
      margin-top: 18px;
      color: var(--muted);
    }

    h1 {
      margin-top: 40px;
      font-weight: 600;
      font-size: clamp(1.6rem, 3vw, 2rem);
    }

    p.tagline {
      margin-top: 16px;
      font-size: 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo-wrap">
      <!-- Inline SVG logo: “window” with pixels -->
      <svg class="logo-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="10" y="10" width="44" height="44" rx="9" ry="9"
              fill="none" stroke="white" stroke-width="4" />
        <!-- pixels flowing out -->
        <rect x="40" y="32" width="5" height="5" fill="white" />
        <rect x="47" y="32" width="5" height="5" fill="white" />
        <rect x="40" y="39" width="5" height="5" fill="white" />
        <rect x="47" y="39" width="5" height="5" fill="white" />
        <rect x="47" y="46" width="5" height="5" fill="white" />
      </svg>
    </div>

    <div class="wordmark">EVERENDER VENTURES</div>

    <h1>We invest in the future of food for active people.</h1>
    <p class="tagline">Long-term capital for founders redefining performance, health, and everyday nutrition.</p>
  </main>
</body>
</html>
